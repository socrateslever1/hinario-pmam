name = "cfap2026"
pages_build_output_dir = "dist/public"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "cfap2026-uploads"

[vars]
# Configure essas variáveis pelo painel do Cloudflare:
# Workers & Pages -> cfap2026 -> Settings -> Environment Variables
# TIDB_HOST
# TIDB_USER
# TIDB_PASSWORD
# TIDB_DATABASE
# OAUTH_SERVER_URL
# BUILT_IN_FORGE_API_URL
# BUILT_IN_FORGE_API_KEY
# SESSION_SECRET

# Variáveis públicas devem ser prefixadas com VITE_ se usadas no front-end
# VITE_ANALYTICS_ENDPOINT
# VITE_ANALYTICS_WEBSITE_ID
