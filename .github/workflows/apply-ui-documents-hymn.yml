name: Apply documents and hymn UI polish

on:
  push:
    branches:
      - feat/qg-digital-ui-polish-v1
    paths:
      - .github/workflows/apply-ui-documents-hymn.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout UI polish branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe document and hymn improvements
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          documents = "client/src/pages/Documents.tsx"

          replace_exact(
              documents,
              'const PARTE_DEFAULT_RELATO = "Considerando que a data natalícia deste Aluno Soldado PM é 18 de abril de 1985, conforme cópia da identidade em anexo.\\nSolicito a possibilidade de que seja concedida a dispensa deste Aluno Soldado das escalas de serviço desta Unidade da PMAM no dia 18 de abril de 2026, fins de congraçamento junto aos familiares e amigos.";',
              'const PARTE_DEFAULT_RELATO = "";',
          )
          replace_exact(documents, 'remetente: "Al. Sd. PM Nº 1234 Silva",', 'remetente: "",', 3)
          replace_exact(documents, 'remetente: "ALUNO SOLDADO PM SILVA",', 'remetente: "",')
          replace_exact(documents, 'parteFatoHora: "08:30",', 'parteFatoHora: "",')
          replace_exact(documents, 'parteFatoLocal: "Sala de Instrução 03",', 'parteFatoLocal: "",')
          replace_exact(documents, 'reqNomeCompleto: "Felipe da Silva Santos",', 'reqNomeCompleto: "",')
          replace_exact(documents, 'reqMatricula: "123.456-7 A",', 'reqMatricula: "",')
          replace_exact(documents, 'reqPelotao: "3º Pelotão - 1ª Companhia",', 'reqPelotao: "",')
          replace_exact(documents, 'reqSolicitacao: "Realização de Segunda Chamada de Avaliação Pedagógica",', 'reqSolicitacao: "",')
          replace_exact(
              documents,
              'reqJustificativa: "Requer a V.S.ª a autorização para a realização da prova de segunda chamada da disciplina de \'Regulamento Disciplinar da PMAM (RDPMAM)\', realizada no dia 04 de junho de 2026, tendo em vista que este requerente encontrava-se impossibilitado de comparecer na data prevista devido a dispensa médica devidamente homologada pela Policlínica da PMAM, conforme atestado em anexo.",',
              'reqJustificativa: "",',
          )
          replace_exact(documents, 'defesaFatoRef: "FAT-048/2026",', 'defesaFatoRef: "",')
          replace_exact(
              documents,
              'defesaTexto: "Em atenção ao fato apontado sob registro FAT-048/2026, referente ao suposto atraso de 10 minutos para a formatura matinal do dia 03 de junho de 2026, venho expor e justificar que o atraso ocorreu devido a uma pane mecânica no veículo particular deste discente a caminho do quartel. Salienta-se que, tão logo resolvido o imprevisto, o discente apresentou-se imediatamente ao oficial de dia, justificando o ocorrido e solicitando sua inclusão no dispositivo formado. Solicito a atenuação do fato sob os preceitos do Art. 22 do Manual do Aluno.",',
              'defesaTexto: "",',
          )
          replace_exact(documents, 'guiaDestino: "Parintins - AM",', 'guiaDestino: "",')
          replace_exact(documents, 'guiaIda: "12/06/2026",', 'guiaIda: "",')
          replace_exact(documents, 'guiaVolta: "15/06/2026",', 'guiaVolta: "",')
          replace_exact(
              documents,
              'guiaMotivo: "Visita familiar durante o período de folga regulamentar de fim de semana prolongado.",',
              'guiaMotivo: "",',
          )
          replace_exact(documents, 'guiaTransporte: "Transporte hidroviário de linha regular",', 'guiaTransporte: "",')

          replace_exact(
              documents,
              '<h1 className="text-xl font-bold text-[#1a3a2a] dark:text-[#e2ca76] md:text-3xl" style={{ fontFamily: "Merriweather, serif" }}>',
              '<h1 className="text-2xl font-bold text-[#1a3a2a] dark:text-[#e2ca76] md:text-3xl" style={{ fontFamily: "Merriweather, serif" }}>',
          )
          replace_exact(
              documents,
              '<p className="mx-auto mt-1.5 max-w-2xl text-xs leading-snug text-muted-foreground md:mt-3 md:text-base md:leading-normal">',
              '<p className="mx-auto mt-2 max-w-2xl text-sm leading-relaxed text-muted-foreground md:mt-3 md:text-base">',
          )
          replace_exact(
              documents,
              '<div className="grid grid-cols-2 gap-4">',
              '<div className="grid grid-cols-1 gap-4 sm:grid-cols-2">',
          )
          replace_exact(
              documents,
              'className="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-[#1a3a2a]/10 text-[10px] font-bold text-[#1a3a2a] dark:text-[#e2ca76]"',
              'className="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-[#1a3a2a]/10 text-xs font-bold text-[#1a3a2a] dark:text-[#e2ca76]"',
          )
          replace_exact(
              documents,
              '<p className="truncate text-[11px] text-muted-foreground">',
              '<p className="truncate text-xs text-muted-foreground">',
          )
          replace_exact(
              documents,
              '<Button asChild size="sm" variant="outline" className="h-8 shrink-0 gap-1 bg-white text-foreground">',
              '<Button asChild size="sm" variant="outline" className="h-10 shrink-0 gap-1 bg-white text-foreground sm:h-9">',
          )

          hymn = "client/src/pages/HymnDetail.tsx"
          replace_exact(
              hymn,
              'className="mb-0.5 text-[11px] font-black uppercase tracking-[0.2em] text-[#f0bd3a] md:text-xs"',
              'className="mb-1 text-xs font-black uppercase tracking-[0.16em] text-[#f0bd3a]"',
          )
          replace_exact(
              hymn,
              'className="truncate text-xl font-black leading-tight text-white md:text-3xl font-serif drop-shadow-sm"',
              'className="line-clamp-2 text-2xl font-black leading-tight text-white font-serif drop-shadow-sm md:text-3xl"',
          )

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Focused regression tests
        run: pnpm exec vitest run client/src/data/cfapHistory.test.ts client/src/lib/imageResize.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated corrections
        run: |
          rm .github/workflows/apply-ui-documents-hymn.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): improve documents and hymn detail mobile UX"
          git push origin feat/qg-digital-ui-polish-v1
