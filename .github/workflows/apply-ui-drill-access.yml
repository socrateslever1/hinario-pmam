name: Apply drill and access mobile polish

on:
  push:
    branches:
      - feat/qg-digital-ui-polish-v1
    paths:
      - .github/workflows/apply-ui-drill-access.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe mobile polish
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}: {old[:120]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          drill = "client/src/pages/Drill.tsx"
          replace_exact(drill, 'className="w-12 bg-transparent text-center text-xs font-bold focus:outline-none dark:text-white"', 'className="w-14 bg-transparent text-center text-sm font-bold focus:outline-none dark:text-white"')
          replace_exact(drill, '<span className="text-[10px] text-muted-foreground">s</span>', '<span className="text-xs text-muted-foreground">s</span>')
          replace_exact(drill, 'className={`h-8 px-2 text-xs ${isDeletingFavorites ? "border-red-600 bg-red-600 text-white hover:bg-red-700 hover:text-white" : ""}`}', 'className={`h-10 px-3 text-xs sm:h-9 ${isDeletingFavorites ? "border-red-600 bg-red-600 text-white hover:bg-red-700 hover:text-white" : ""}`}')
          replace_exact(drill, 'className="h-8 px-2 text-xs">Limpar</Button>', 'className="h-10 px-3 text-xs sm:h-9">Limpar</Button>')
          replace_exact(drill, 'className="grid grid-cols-5 gap-x-1.5 gap-y-4 pb-2 pt-1 sm:gap-x-3 md:grid-cols-6 lg:grid-cols-8"', 'className="grid grid-cols-4 gap-x-2 gap-y-5 pb-2 pt-1 sm:grid-cols-5 sm:gap-x-3 md:grid-cols-6 lg:grid-cols-8"')
          replace_exact(drill, 'className="absolute right-0 top-0 z-10 grid h-5 w-5 place-items-center rounded-full border-2 border-white bg-red-700 text-white shadow-md sm:h-6 sm:w-6"', 'className="absolute right-0 top-0 z-10 grid h-8 w-8 place-items-center rounded-full border-2 border-white bg-red-700 text-white shadow-md sm:h-7 sm:w-7"')
          replace_exact(drill, 'className="grid h-6 flex-1 place-items-center rounded-full border border-[#1a3a2a]/25 bg-background disabled:opacity-20"', 'className="grid h-8 flex-1 place-items-center rounded-full border border-[#1a3a2a]/25 bg-background disabled:opacity-20 sm:h-7"', 2)
          replace_exact(drill, 'className="grid grid-cols-4 gap-x-2 gap-y-5 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10"', 'className="grid grid-cols-3 gap-x-3 gap-y-6 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10"')
          replace_exact(drill, 'className="absolute right-0 top-0 grid h-6 w-6 place-items-center rounded-full border-2 border-white bg-[#142d21] text-white shadow-md"', 'className="absolute right-0 top-0 grid h-8 w-8 place-items-center rounded-full border-2 border-white bg-[#142d21] text-white shadow-md sm:h-7 sm:w-7"', 2)
          replace_exact(drill, 'className="grid grid-cols-4 gap-x-2 gap-y-5 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8"', 'className="grid grid-cols-3 gap-x-3 gap-y-6 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8"', 2)
          replace_exact(drill, 'className="rounded-lg border bg-background p-2"><p className="mb-2 text-xs font-black">{hymn.title}</p>', 'className="rounded-lg border bg-background p-3"><p className="mb-2 text-sm font-black leading-snug">{hymn.title}</p>')
          replace_exact(drill, 'className="flex w-full items-center justify-between rounded-md bg-[#1a3a2a] px-3 py-2 text-xs font-bold text-white"', 'className="flex min-h-11 w-full items-center justify-between rounded-md bg-[#1a3a2a] px-3 py-2 text-sm font-bold text-white"')
          replace_exact(drill, 'className="flex w-full items-center justify-between rounded-md border px-3 py-2 text-xs font-bold"', 'className="flex min-h-11 w-full items-center justify-between rounded-md border px-3 py-2 text-sm font-bold"')

          sound = "client/src/components/CommandSoundButton.tsx"
          replace_exact(sound, '${compact ? "text-[10px]" : "text-xs sm:text-sm"}', '${compact ? "text-xs" : "text-xs sm:text-sm"}')
          replace_exact(sound, 'text-[11px] ${darkSurface ? "text-white/60" : "text-muted-foreground"}', 'text-xs ${darkSurface ? "text-white/60" : "text-muted-foreground"}')

          access = "client/src/pages/AccessManagement.tsx"
          replace_exact(access, '<p className="mt-0.5 text-xs text-muted-foreground sm:text-sm">Contas administrativas e níveis de acesso do sistema</p>', '<p className="mt-1 text-sm leading-relaxed text-muted-foreground">Contas administrativas e níveis de acesso do sistema</p>')
          replace_exact(access, 'className="p-1.5 hover:bg-emerald-100 dark:hover:bg-emerald-900 rounded-lg transition-colors"', 'className="flex h-10 w-10 items-center justify-center rounded-lg transition-colors hover:bg-emerald-100 dark:hover:bg-emerald-900"')
          replace_exact(access, 'className="h-9 text-xs sm:text-sm font-semibold"', 'className="h-10 text-xs font-semibold sm:h-9 sm:text-sm"', 3)

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Focused regression tests
        run: pnpm exec vitest run client/src/lib/drillStateMachine.test.ts client/src/lib/drillPanelPreferences.test.ts client/src/data/cfapHistory.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated polish
        run: |
          rm .github/workflows/apply-ui-drill-access.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): improve Ordem Unida and access management mobile UX"
          git push origin feat/qg-digital-ui-polish-v1
