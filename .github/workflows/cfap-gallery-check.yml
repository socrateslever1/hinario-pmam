name: Validate QG Digital

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'shared/**'
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'tsconfig.json'
      - '.github/workflows/cfap-gallery-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Regression tests
        run: pnpm exec vitest run client/src/data/cfapHistory.test.ts client/src/lib/imageResize.test.ts
      - name: Production build
        run: pnpm build
