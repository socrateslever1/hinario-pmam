name: Apply document editor mobile polish

on:
  push:
    branches:
      - feat/qg-digital-ui-polish-v1
    paths:
      - .github/workflows/apply-ui-documents-controls.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile editor and signature hardening
        shell: python
        run: |
          from pathlib import Path
          path = Path("client/src/pages/Documents.tsx")
          text = path.read_text(encoding="utf-8")

          def rep(old, new, count=1):
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"expected {count}, found {actual}: {old[:120]!r}")
              text = text.replace(old, new, count)

          rep('className="text-muted-foreground hover:text-destructive gap-1 px-2 h-8"', 'className="h-10 gap-1 px-3 text-muted-foreground hover:text-destructive sm:h-9"')
          rep('className="text-[11px] font-bold uppercase tracking-wider text-[#1a3a2a] dark:text-[#e2ca76]"', 'className="text-xs font-bold uppercase tracking-wider text-[#1a3a2a] dark:text-[#e2ca76]"')
          rep('<div className="grid grid-cols-2 gap-2">', '<div className="grid grid-cols-1 gap-3 sm:grid-cols-2">')
          rep('className="text-[10px] font-semibold text-foreground/70"', 'className="text-xs font-semibold text-foreground/70"', 2)
          rep('className="h-8 text-xs bg-white text-black"', 'className="h-11 bg-white text-sm text-black sm:h-9"', 2)
          rep('<p className="text-[9px] text-muted-foreground">\n                    * Ao preencher a numérica ou RG/CI, os campos da Parte e Requerimento serão atualizados automaticamente.\n                  </p>', '<p className="text-xs leading-relaxed text-muted-foreground">\n                    * Ao preencher a numérica ou RG/CI, os campos da Parte e Requerimento serão atualizados automaticamente.\n                  </p>')
          rep('className="h-6 text-[10px] px-2 bg-white"', 'className="h-10 bg-white px-3 text-xs sm:h-9"', 2)
          rep('<div className="grid grid-cols-2 gap-3">', '<div className="grid grid-cols-1 gap-3 sm:grid-cols-2">')

          rep('className="text-[10px] text-muted-foreground font-semibold">Brasão Esquerdo (PMAM)</label>', 'className="text-xs font-semibold text-muted-foreground">Brasão Esquerdo (PMAM)</label>')
          rep('className="text-[10px] text-muted-foreground font-semibold">Brasão Direito (CFAP)</label>', 'className="text-xs font-semibold text-muted-foreground">Brasão Direito (CFAP)</label>')
          rep('className="text-[10px] h-9 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-[#1a3a2a]/10 file:text-[#1a3a2a] dark:text-[#e2ca76] hover:file:bg-[#1a3a2a]/20"', 'className="h-11 text-sm file:mr-2 file:rounded file:border-0 file:bg-[#1a3a2a]/10 file:px-2 file:py-1 file:text-xs file:font-semibold file:text-[#1a3a2a] hover:file:bg-[#1a3a2a]/20 dark:text-[#e2ca76] sm:h-9"', 2)
          rep('className="w-full text-xs text-red-600 hover:text-red-700 hover:bg-red-50 h-8 font-semibold"', 'className="h-10 w-full text-xs font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 sm:h-9"')
          rep('className="absolute top-0 right-0 p-0.5 bg-red-600 text-white rounded-bl hover:bg-red-700"', 'className="absolute right-0 top-0 flex h-8 w-8 items-center justify-center rounded-bl bg-red-600 text-white hover:bg-red-700"')
          rep('className="text-xs h-9 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-[#1a3a2a]/10 file:text-[#1a3a2a] hover:file:bg-[#1a3a2a]/20"', 'className="h-11 text-sm file:mr-2 file:rounded file:border-0 file:bg-[#1a3a2a]/10 file:px-2 file:py-1 file:text-xs file:font-semibold file:text-[#1a3a2a] hover:file:bg-[#1a3a2a]/20 sm:h-9"')
          rep('<p className="text-[10px] text-muted-foreground">\n                    * O Xerife Geral poderá visualizar e rolar as folhas adicionais com os anexos.\n                  </p>', '<p className="text-xs leading-relaxed text-muted-foreground">\n                    * O Xerife Geral poderá visualizar e rolar as folhas adicionais com os anexos.\n                  </p>')
          rep('className="text-[10px] text-green-800 font-mono font-bold uppercase tracking-wider text-center"', 'className="text-center font-mono text-xs font-bold uppercase tracking-wider text-green-800"')
          rep('className="text-[9px] text-green-700 font-mono break-words text-left space-y-0.5"', 'className="space-y-1 break-words text-left font-mono text-xs leading-relaxed text-green-700"')
          rep('className="w-full text-[10px] text-red-600 hover:text-red-700 hover:bg-red-50 h-7"', 'className="h-10 w-full text-xs text-red-600 hover:bg-red-50 hover:text-red-700 sm:h-9"')
          rep('const sessionTokenTrunc = session.sessionToken ? session.sessionToken.slice(0, 8) + "..." : "N/A";\n', '')
          rep('                            `Sessão: ${sessionTokenTrunc}`,\n', '')
          rep('<p className="text-[10px] text-muted-foreground text-center">\n                    * Assine digitalmente antes de enviar via sistema.\n                  </p>', '<p className="text-center text-xs leading-relaxed text-muted-foreground">\n                    * Assine digitalmente antes de enviar via sistema.\n                  </p>')

          path.write_text(text, encoding="utf-8")

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Regression tests
        run: pnpm exec vitest run client/src/data/cfapHistory.test.ts client/src/lib/imageResize.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated document editor polish
        run: |
          rm .github/workflows/apply-ui-documents-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): improve document editor mobile ergonomics"
          git push origin feat/qg-digital-ui-polish-v1
