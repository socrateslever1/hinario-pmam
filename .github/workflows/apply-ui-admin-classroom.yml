name: Apply command area UI polish

on:
  push:
    branches:
      - feat/qg-digital-ui-polish-v1
    paths:
      - .github/workflows/apply-ui-admin-classroom.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout UI polish branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe responsive improvements
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:90]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          admin = "client/src/pages/AdministrativeRoom.tsx"
          replace_exact(
              admin,
              'className="h-9 w-9 rounded-full border bg-white dark:bg-zinc-900"',
              'className="h-11 w-11 rounded-full border bg-white dark:bg-zinc-900 sm:h-9 sm:w-9"',
          )
          replace_exact(
              admin,
              '<h1 className="text-2xl font-black text-[#1a3a2a] dark:text-[#c4a84b]">Sala Administrativa</h1>',
              '<h1 className="text-2xl font-black text-[#1a3a2a] dark:text-[#c4a84b] sm:text-3xl">Sala Administrativa</h1>',
          )
          replace_exact(
              admin,
              '<p className="text-xs text-muted-foreground">Área administrativa do comando para validar Fatos Observados, formalizar Licença Caçada e acompanhar baixados.</p>',
              '<p className="mt-1 max-w-3xl text-sm leading-relaxed text-muted-foreground">Área administrativa do comando para validar Fatos Observados, formalizar Licença Cassada (LC) e acompanhar baixados.</p>',
          )
          replace_exact(
              admin,
              '<div className="mb-5 grid grid-cols-3 gap-2 sm:gap-3">',
              '<div className="mb-5 grid grid-cols-1 gap-2 sm:grid-cols-3 sm:gap-3">',
          )
          replace_exact(
              admin,
              '<p className="text-[9px] font-black uppercase leading-tight text-amber-800 dark:text-amber-200">FO pendente</p>',
              '<p className="text-xs font-black uppercase leading-tight text-amber-800 dark:text-amber-200">FO pendente</p>',
          )
          replace_exact(
              admin,
              '<p className="text-[9px] font-black uppercase leading-tight text-red-800 dark:text-red-200">LC a decidir</p>',
              '<p className="text-xs font-black uppercase leading-tight text-red-800 dark:text-red-200">LC a decidir</p>',
          )
          replace_exact(
              admin,
              '<p className="text-[9px] font-black uppercase leading-tight text-blue-800 dark:text-blue-200">Baixados</p>',
              '<p className="text-xs font-black uppercase leading-tight text-blue-800 dark:text-blue-200">Baixados</p>',
          )

          classroom = "client/src/pages/ClassroomMap.tsx"
          replace_exact(
              classroom,
              'className="h-9 w-9 shrink-0 rounded-full border border-border bg-white dark:bg-zinc-900"',
              'className="h-11 w-11 shrink-0 rounded-full border border-border bg-white dark:bg-zinc-900 sm:h-9 sm:w-9"',
          )
          replace_exact(
              classroom,
              'className="h-9 w-full min-w-0 bg-white text-sm font-semibold dark:bg-zinc-900 sm:w-[150px] border-border/50"',
              'className="h-11 w-full min-w-0 bg-white text-sm font-semibold dark:bg-zinc-900 sm:h-9 sm:w-[150px] border-border/50"',
          )
          replace_exact(
              classroom,
              'className="h-9 w-full min-w-0 bg-white text-sm font-semibold dark:bg-zinc-900 sm:w-[128px] border-border/50"',
              'className="h-11 w-full min-w-0 bg-white text-sm font-semibold dark:bg-zinc-900 sm:h-9 sm:w-[128px] border-border/50"',
          )
          replace_exact(
              classroom,
              'className="h-[54px] overflow-hidden border-border/50 bg-white py-0 shadow-sm transition-all duration-300 hover:border-[#c4a84b]/50 hover:bg-[#c4a84b]/5 dark:bg-zinc-900 md:h-[56px]"',
              'className="min-h-16 overflow-hidden border-border/50 bg-white py-0 shadow-sm transition-all duration-300 hover:border-[#c4a84b]/50 hover:bg-[#c4a84b]/5 dark:bg-zinc-900 md:h-[60px] md:min-h-0"',
          )
          replace_exact(
              classroom,
              'className="flex h-full items-center gap-2 px-2 py-1.5 md:px-2.5"',
              'className="flex h-full items-center gap-2.5 px-3 py-2.5 md:px-2.5 md:py-1.5"',
          )
          replace_exact(
              classroom,
              'className="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-[#c4a84b]/10 text-[#c4a84b]"',
              'className="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-[#c4a84b]/10 text-[#c4a84b] md:h-7 md:w-7"',
          )
          replace_exact(
              classroom,
              '<p className="truncate text-[11px] font-black leading-tight text-foreground md:hidden">{opt.mobileTitle}</p>',
              '<p className="truncate text-xs font-black leading-tight text-foreground md:hidden">{opt.mobileTitle}</p>',
          )
          replace_exact(
              classroom,
              '<p className="mt-0.5 truncate text-[9.5px] leading-tight text-muted-foreground md:hidden">{opt.mobileDesc}</p>',
              '<p className="mt-0.5 truncate text-xs leading-tight text-muted-foreground md:hidden">{opt.mobileDesc}</p>',
          )
          replace_exact(
              classroom,
              '<span className="text-[9px] font-black uppercase tracking-[0.25em] text-muted-foreground">',
              '<span className="text-xs font-black uppercase tracking-[0.16em] text-muted-foreground">',
          )
          replace_exact(
              classroom,
              'className="h-9 border-border/50 bg-white pl-9 text-sm dark:bg-zinc-800"',
              'className="h-11 border-border/50 bg-white pl-9 text-sm dark:bg-zinc-800 sm:h-9"',
          )
          replace_exact(
              classroom,
              'className="flex min-w-0 items-center gap-2 rounded-md border bg-background px-2 py-1.5 text-left transition-colors hover:border-[#c4a84b]/60 hover:bg-[#c4a84b]/5"',
              'className="flex min-h-11 min-w-0 items-center gap-2 rounded-md border bg-background px-2 py-2 text-left transition-colors hover:border-[#c4a84b]/60 hover:bg-[#c4a84b]/5"',
          )
          replace_exact(
              classroom,
              'className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#1a3a2a]/10 text-[10px] font-bold text-[#1a3a2a] dark:text-green-300"',
              'className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#1a3a2a]/10 text-xs font-bold text-[#1a3a2a] dark:text-green-300"',
          )
          replace_exact(
              classroom,
              '<span className="block text-[10px] text-muted-foreground">{student.numerica} · {student.deskNumber ? `Carteira ${student.deskNumber}` : "Sem carteira"}</span>',
              '<span className="block text-xs text-muted-foreground">{student.numerica} · {student.deskNumber ? `Carteira ${student.deskNumber}` : "Sem carteira"}</span>',
          )

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Commit validated UI corrections
        run: |
          rm .github/workflows/apply-ui-admin-classroom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): improve command and classroom mobile ergonomics"
          git push origin feat/qg-digital-ui-polish-v1
